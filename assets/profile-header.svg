<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" role="img" aria-labelledby="title desc">
  <title id="title">Vadim Kulishov — Frontend Developer</title>
  <desc id="desc">A minimal dark profile banner with a subtle animated accent line.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.52" stop-color="#71d6c5"/>
      <stop offset="1" stop-color="#a6b7ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="42%" r="56%">
      <stop offset="0" stop-color="#5e8fcf" stop-opacity=".20"/>
      <stop offset="1" stop-color="#5e8fcf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .eyebrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 3px; fill: #9aa9bb; }
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 42px; font-weight: 600; letter-spacing: -1.5px; fill: #f0f4fa; }
      .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 400; fill: #aeb9c8; }
      .stack { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .7px; fill: #8fa0b4; }
      .monogram { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 25px; font-weight: 600; letter-spacing: -1px; fill: #dce7f5; }
      .orbit { transform-origin: 824px 113px; animation: turn 36s linear infinite; }
      .soft-pulse { transform-origin: 824px 113px; animation: breathe 8s ease-in-out infinite; }
      .moving-line { stroke-dasharray: 145 815; animation: travel 12s ease-in-out infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
      @keyframes travel { 0% { stroke-dashoffset: 960; } 60%, 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .soft-pulse, .moving-line { animation: none; }
        .soft-pulse { opacity: .75; }
        .moving-line { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="230" rx="18" fill="#0d1420" stroke="#263446" stroke-width="1.5"/>
  <rect x="2" y="2" width="956" height="228" rx="17" fill="url(#glow)"/>

  <path d="M28 1 H932" stroke="#314258" stroke-width="1" opacity=".65"/>
  <path d="M18 1 H180" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" class="moving-line"/>

  <text x="58" y="66" class="eyebrow">HELLO, I'M</text>
  <text x="56" y="121" class="name">Vadim Kulishov</text>
  <text x="58" y="157" class="role">Frontend Developer</text>
  <text x="58" y="190" class="stack">REACT  ·  TYPESCRIPT  ·  JAVASCRIPT</text>

  <g class="soft-pulse">
    <circle cx="824" cy="113" r="65" fill="#6ea8fe" opacity=".055"/>
    <circle cx="824" cy="113" r="52" fill="none" stroke="#526983" stroke-width="1" opacity=".55"/>
  </g>
  <g class="orbit" fill="none" stroke="url(#accent)" stroke-width="1.3" opacity=".8">
    <ellipse cx="824" cy="113" rx="69" ry="25" transform="rotate(-32 824 113)" stroke-dasharray="3 7"/>
  </g>
  <circle cx="824" cy="113" r="37" fill="#182638" stroke="#526983" stroke-width="1.2"/>
  <text x="824" y="122" class="monogram" text-anchor="middle">VK</text>
  <circle cx="878" cy="74" r="3" fill="#71d6c5" opacity=".9"/>
</svg>
