<svg
xmlns="http://www.w3.org/2000/svg"
width="372.0"
height="379"
viewBox="0 0 372.0 379"
role="img"
aria-label="Cyberpunk ASCII portrait"
>

<style>

.ascii {
    font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        "Courier New",
        monospace;

    font-size: 7.5px;

    fill: #d7d7d7;

    dominant-baseline: middle;

    letter-spacing: 0px;
}

.header {
    fill: #fcee0a;

    font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        "Courier New",
        monospace;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 2px;
}

.meta {
    fill: #777b85;

    font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        "Courier New",
        monospace;

    font-size: 8px;

    letter-spacing: 1px;
}

.scan {
    fill: #00f0ff;

    opacity: 0.08;

    animation:
        scan 3s linear infinite;
}

@keyframes scan {

    from {
        transform:
            translateY(-100px);
    }

    to {
        transform:
            translateY(379px);
    }

}

.row {
    opacity: 0;

    animation:
        print-row
        0.25s
        ease-out
        forwards;
}

@keyframes print-row {

    from {
        opacity: 0;

        clip-path:
            inset(
                0
                100%
                0
                0
            );
    }

    to {
        opacity: 1;

        clip-path:
            inset(
                0
                0
                0
                0
            );
    }

}

.corner {
    fill: none;

    stroke-width: 1.5;
}

@media (prefers-reduced-motion: reduce) {

    .row {
        animation: none;

        opacity: 1;
    }

    .scan {
        animation: none;
    }

}

</style>

<!-- BACKGROUND -->

<rect
    x="1"
    y="1"
    width="370.0"
    height="377"
    rx="4"
