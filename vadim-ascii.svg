<svg
xmlns="http://www.w3.org/2000/svg"
width="453.0"
height="451"
viewBox="0 0 453.0 451"
role="img"
aria-label="Cyberpunk ASCII portrait of Vadim Kulishov"
>

<style>

.ascii {

    font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        "Courier New",
        monospace;

    font-size: 7.5px;

    fill: #d7d7d7;

    dominant-baseline: middle;

    letter-spacing: 0px;
}


/* =====================================================
   CYBERPUNK HEADER
   ===================================================== */

.header {

    fill: #fcee0a;

    font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        "Courier New",
        monospace;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 2px;
}


.meta {

    fill: #777b85;

    font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        "Courier New",
        monospace;

    font-size: 8px;

    letter-spacing: 1px;
}


/* =====================================================
   ASCII PRINT ANIMATION
   ===================================================== */

.row {

    opacity: 0;

    animation:
        print-row
        10s
        ease-in-out
        infinite;

}


@keyframes print-row {

    /*
     * START
     */

    0% {

        opacity: 0;

        clip-path:
            inset(
                0 100% 0 0
            );

    }


    /*
     * PRINTED
     */

    30% {

        opacity: 1;

        clip-path:
            inset(
                0 0 0 0
            );

    }


    /*
     * HOLD
     */

    65% {

        opacity: 1;

        clip-path:
            inset(
                0 0 0 0
            );

    }


    /*
     * ERASE
     */

    100% {

        opacity: 0;

        clip-path:
            inset(
                0 100% 0 0
            );

    }

}


/* =====================================================
   SCANLINE
   ===================================================== */

.scan {

    fill: #00f0ff;

    opacity: 0.06;

    animation:
        scan
        4s
        linear
        infinite;

}


@keyframes scan {

    from {

        transform:
            translateY(-20px);

    }

    to {

        transform:
            translateY(451px);

    }

}


/* =====================================================
   REDUCED MOTION
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    .row {

        animation: none;

        opacity: 1;

        clip-path:
            inset(
                0 0 0 0
            );

    }

    .scan {

        animation: none;

    }

}

</style>


