<svg
    xmlns="http://www.w3.org/2000/svg"
    width="490"
    height="330"
    viewBox="0 0 490 330"
>
<style>
    .background {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1;
    }

    .title {
        fill: #8b949e;
        font-family:
            "SFMono-Regular",
            "Cascadia Code",
            "Roboto Mono",
            "Courier New",
            monospace;
        font-size: 13px;
        font-weight: 600;
    }

    .key {
        font-family:
            "SFMono-Regular",
            "Cascadia Code",
            "Roboto Mono",
            "Courier New",
            monospace;
        font-size: 14px;
        font-weight: 600;
    }

    .value {
        fill: #c9d1d9;
        font-family:
            "SFMono-Regular",
            "Cascadia Code",
            "Roboto Mono",
            "Courier New",
            monospace;
        font-size: 14px;
    }

    .line {
        opacity: 0;
        transform: translateX(-8px);
        animation: appear 0.35s ease-out forwards;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateX(-8px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .line {
            animation: none;
            opacity: 1;
            transform: none;
        }
    }
</style>

<rect
    class="background"
    x="0.5"
    y="0.5"
    width="489"
    height="329"
    rx="10"
/>

<circle cx="18" cy="18" r="5" fill="#ff5f56"/>
<circle cx="35" cy="18" r="5" fill="#ffbd2e"/>
<circle cx="52" cy="18" r="5" fill="#27c93f"/>

<text
